  - invoiceId
  - associationId
  consumers:
  - 'documents: PDF facture'
  - 'notifications: owner'
- type: subscription.invoice_paid
  emitter: billing
  lot: '4.6'
  version: 1
  payload:
  - invoiceId
  consumers:
  - 'notifications: owner'
- type: statement.imported
  emitter: reconciliation
  lot: '5.1'
  version: 1
