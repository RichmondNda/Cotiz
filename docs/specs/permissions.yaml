# Généré depuis la spécification Cotiz. Normatif : packages/contracts et le code doivent s'y conformer.
# Toute évolution passe par une modification de ce fichier (PR dédiée), puis du code.
# Rôles : platform:{owner,admin,support} · association:{owner,manager,viewer} · subscriber. « * » = tout le monde, « *authenticated » = toute personne connectée.
permissions:
- permission: public
  roles:
  - '*'
  endpoints:
  - sys.health
  - auth.login
  - auth.refresh
  - auth.forgot
  - auth.verify
  - auth.reset
  - auth.activate
  - auth.mfa
  - pub.plans
  - pub.challenge
  - pub.request
  - pub.legal
  - psp.webhook
- permission: authenticated
  roles:
  - '*authenticated'
  endpoints:
  - fl.upload
  - fl.get
  - auth.logout
  - me
  - nt.list
  - nt.read
  - nt.stream
  - me.push
  - me.profile
  - me.prefs
- permission: platform.requests.manage
  roles:
  - platform:owner
  - platform:admin
  endpoints:
  - pf.req.approve
  - pf.req.reject
- permission: platform.associations.read
  roles:
  - platform:owner
  - platform:admin
  - platform:support
  endpoints:
  - pf.req.list
  - pf.req.get
  - pf.asso.list
