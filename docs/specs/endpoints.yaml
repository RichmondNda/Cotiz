# Généré depuis la spécification Cotiz. Normatif : packages/contracts et le code doivent s'y conformer.
# Toute évolution passe par une modification de ce fichier (PR dédiée), puis du code.
# Chaque id regroupe une ou plusieurs opérations HTTP d'une même ressource.
# Erreurs transverses toujours possibles (non répétées) : validation_failed, not_found, forbidden, too_many_requests, feature_disabled, version_conflict (si ifMatch), idempotency_key_reused (si idempotencyKey).
basePath: /api/v1
endpoints:
- id: sys.health
  lot: '0.1'
  space: system
  permission: public
  operations:
  - method: GET
    path: /api/v1/health/live
  - method: GET
    path: /api/v1/health/ready
  summary: Sondes de vie et de disponibilité (base, Redis, MinIO)
  errors: []
  emits: []
  idempotencyKey: false
  ifMatch: false
  rateLimited: false
  audited: false
  screens: []
- id: fl.upload
