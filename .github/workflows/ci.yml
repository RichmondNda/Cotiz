name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  qualite:
    name: Lint, typecheck, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Le contrat d'API committé doit correspondre aux handlers de mocks.
      - name: Contrat d'API à jour
        run: |
          npm run contrat-api
          git diff --exit-code -- ../docs/api-v0.md || { echo "::error::docs/api-v0.md n'est pas à jour : lancer « npm run contrat-api » dans frontend/"; exit 1; }

  parcours:
    name: Parcours, cohérence, accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serveur de dev (mocks Nitro)
        run: |
          nohup npm run dev > dev.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3000/connexion && exit 0
            sleep 2
          done
          cat dev.log
          exit 1
      - run: npm run e2e
      - run: npm run coherence
      - run: npm run a11y
      - name: Captures et journal du serveur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verif-e2e
          path: |
            frontend/.verif/e2e
            frontend/dev.log
          if-no-files-found: ignore
