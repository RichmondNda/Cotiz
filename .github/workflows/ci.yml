name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, typecheck, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Le contrat d'API committé doit correspondre aux handlers de mocks.
      - name: Contrat d'API à jour
        run: |
          pnpm --filter frontend contrat-api
          git diff --exit-code -- docs/api-v0.md || { echo "::error::docs/api-v0.md n'est pas à jour : lancer « pnpm --filter frontend contrat-api »"; exit 1; }

  parcours:
    name: Parcours, cohérence, accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Serveur de dev (mocks Nitro)
        working-directory: frontend
        run: |
          nohup pnpm dev > dev.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3000/connexion && exit 0
            sleep 2
          done
          cat dev.log
          exit 1
      - run: pnpm --filter frontend e2e
      - run: pnpm --filter frontend coherence
      - run: pnpm --filter frontend a11y
      - name: Captures et journal du serveur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verif-e2e
          path: |
            frontend/.verif/e2e
            frontend/dev.log
          if-no-files-found: ignore
