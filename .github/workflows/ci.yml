name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Vérifications (pnpm verify) et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Inclut les tests d'intégration du back (Testcontainers : Docker est disponible sur le runner).
      - run: pnpm verify
      # Exceptions temporaires (pnpm.auditConfig.ignoreGhsas de package.json) : ADR 0016,
      # outils de dev/build de Nuxt absents de .output. Réexamen au plus tard le 2026-11-09.
      - name: Audit des dépendances de production
        run: pnpm audit --prod
      - run: pnpm build

  # Analyse des fichiers contre un vrai clamd (lot 0.5) : hors de pnpm verify, signatures en cache entre exécutions.
  antivirus:
    name: Antivirus (clamd réel)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Signatures ClamAV (cache)
        uses: actions/cache@v4
        with:
          path: ~/clamav-db
          key: clamav-db-${{ github.run_id }}
          restore-keys: clamav-db-
      - name: clamd
        run: |
          mkdir -p ~/clamav-db && sudo chmod -R a+rwX ~/clamav-db
          docker run -d --name clamav -p 127.0.0.1:3310:3310 -v ~/clamav-db:/var/lib/clamav clamav/clamav:stable
          for i in $(seq 1 120); do
            docker exec clamav clamdcheck.sh >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec clamav clamdcheck.sh
      - run: pnpm --filter backend test:clamav
        env:
          CLAMAV_URL: tcp://127.0.0.1:3310
      - name: Signatures lisibles pour le cache
        if: always()
        run: sudo chmod -R a+rX ~/clamav-db

  # Contrat d'API : un changement cassant de openapi.json par rapport à la branche cible fait échouer la PR.
  contrat-openapi:
    name: Contrat OpenAPI (oasdiff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changements cassants par rapport à ${{ github.base_ref }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          spec=packages/contracts/openapi.json
          if ! git cat-file -e "origin/$BASE_REF:$spec" 2>/dev/null; then
            echo "Pas de $spec sur $BASE_REF : première version du contrat, comparaison sautée."
            exit 0
          fi
          mkdir -p .oasdiff
          git show "origin/$BASE_REF:$spec" > .oasdiff/base.json
          # Changements cassants acceptés explicitement : .github/oasdiff-err-ignore.txt (une ligne justifiée par changement).
          docker run --rm -v "$PWD:/w:ro" tufin/oasdiff:v1.32.1 breaking /w/.oasdiff/base.json "/w/$spec" --fail-on ERR \
            --err-ignore /w/.github/oasdiff-err-ignore.txt

  # Images construites et analysées, jamais publiées : la publication (GHCR) et la recette arrivent au lot 7.1.
  images:
    name: Image ${{ matrix.image }} (build + Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    env:
      TRIVY: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}:/src:ro aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          tags: cotiz-${{ matrix.image }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Trivy — Dockerfile
        run: $TRIVY config --quiet --severity HIGH,CRITICAL --exit-code 1 /src/infra/docker/${{ matrix.image }}.Dockerfile
      - name: Trivy — image
        run: $TRIVY image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 cotiz-${{ matrix.image }}:ci

  parcours:
    name: Parcours, cohérence, accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend exec playwright install --with-deps chromium
      # Espace plateforme basculé (lot 1.1) : vraie connexion avec le compte de développement (seed-dev).
      - name: PostgreSQL, PgBouncer et Redis
        run: docker compose -f infra/compose/local.yml up -d --wait postgres pgbouncer redis
      - name: Migrations et compte de développement
        run: |
          pnpm db:migrate
          pnpm --filter backend cli seed-dev
        env:
          MIGRATION_DATABASE_URL: postgres://cotiz_migrator:cotiz-migrator-local@127.0.0.1:5432/cotiz
          DATABASE_URL: postgres://cotiz_app:cotiz-app-local@127.0.0.1:6432/cotiz
          REDIS_URL: redis://127.0.0.1:6379
          S3_ENDPOINT: http://127.0.0.1:9000
          NODE_ENV: development
          COTIZ_DEV_SEED: '1'
      - name: Api NestJS
        working-directory: backend
        run: |
          nohup node --conditions=development --import @swc-node/register/esm-register src/main.ts > api.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:4000/api/v1/health/live && exit 0
            sleep 2
          done
          cat api.log
          exit 1
        env:
          DATABASE_URL: postgres://cotiz_app:cotiz-app-local@127.0.0.1:6432/cotiz
          REDIS_URL: redis://127.0.0.1:6379
          S3_ENDPOINT: http://127.0.0.1:9000
          NODE_ENV: development
          LOG_PRETTY: 'false'
      - name: Serveur de dev (mocks Nitro)
        working-directory: frontend
        run: |
          nohup pnpm dev > dev.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3000/connexion && exit 0
            sleep 2
          done
          cat dev.log
          exit 1
      - run: pnpm --filter frontend e2e
      - run: pnpm --filter frontend coherence
      - run: pnpm --filter frontend a11y
        env:
          # Runner à 2 cœurs : 4 pages en parallèle sur le serveur de dev dépassaient le délai de navigation.
          A11Y_PARALLELE: '2'
      - name: Captures et journal du serveur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verif-e2e
          path: |
            frontend/.verif/e2e
            frontend/dev.log
            backend/api.log
          if-no-files-found: ignore
