<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"><link rel="stylesheet" href="../../../css/cotiz-tokens.css"><link rel="stylesheet" href="../../../css/bundle.css"><script src="../../bundle.js"></script><script>addEventListener("DOMContentLoaded",()=>window.Cotiz&&Cotiz.hydrate&&Cotiz.hydrate())</script><title>Graphiques</title></head>
<body>
<style>
.ch .ax{fill:var(--text-muted);font-family:var(--font-text);font-size:9px}.ch .gl{stroke:var(--divider)}.ch .base{stroke:var(--border)}
.ch .exp{fill:var(--border)}.ch .rec{fill:var(--brand)}.ch .now{fill:var(--brand);opacity:.55}
.ring .trk{stroke:var(--track)}.ring .ok{stroke:var(--success)}.ring .wa{stroke:var(--warning)}.ring .ko{stroke:var(--danger)}
.ring .big{font-family:var(--font-display);font-weight:600;font-size:22px;fill:var(--text-strong)}.ring .sm{font-family:var(--font-text);font-size:9px;fill:var(--text-muted)}
.cum .ln{stroke:var(--brand);fill:none;stroke-width:2.5;stroke-linecap:round}.cum .ar{fill:var(--brand);opacity:.1}.cum .tg{stroke:var(--brand);stroke-dasharray:4 4;opacity:.5;stroke-width:2}.cum .pt{fill:var(--brand)}
.ttl{font-family:var(--font-display);font-weight:600;font-size:14px;margin-bottom:10px;color:var(--text-strong)}
.lg{font-size:12px;color:var(--text-muted);display:flex;gap:14px;margin-top:4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
<div class="pv pv-row" style="gap:18px;align-items:stretch">
 <div class="cz-card" style="flex:1.4;min-width:340px" data-theme="manager"><div class="ttl">Collecte mensuelle — attendu vs reçu</div>
  <svg class="ch" viewBox="0 0 340 150" width="100%"><line class="base" x1="30" y1="130" x2="335" y2="130"/><line class="gl" x1="30" y1="90" x2="335" y2="90"/><line class="gl" x1="30" y1="50" x2="335" y2="50"/>
   <text class="ax" x="4" y="133">0</text><text class="ax" x="0" y="93">0,5M</text><text class="ax" x="4" y="53">1M</text>
   <rect class="exp" x="42" y="50" width="16" height="80" rx="3"/><rect class="rec" x="60" y="56" width="16" height="74" rx="3"/>
   <rect class="exp" x="92" y="50" width="16" height="80" rx="3"/><rect class="rec" x="110" y="52" width="16" height="78" rx="3"/>
   <rect class="exp" x="142" y="50" width="16" height="80" rx="3"/><rect class="rec" x="160" y="64" width="16" height="66" rx="3"/>
   <rect class="exp" x="192" y="50" width="16" height="80" rx="3"/><rect class="rec" x="210" y="70" width="16" height="60" rx="3"/>
   <rect class="exp" x="242" y="50" width="16" height="80" rx="3"/><rect class="rec" x="260" y="58" width="16" height="72" rx="3"/>
   <rect class="exp" x="292" y="50" width="16" height="80" rx="3"/><rect class="now" x="310" y="96" width="16" height="34" rx="3"/>
   <g text-anchor="middle"><text class="ax" x="59" y="143">Avr.</text><text class="ax" x="109" y="143">Mai</text><text class="ax" x="159" y="143">Juin</text><text class="ax" x="209" y="143">Juil.</text><text class="ax" x="259" y="143">Août</text><text class="ax" x="309" y="143">Sept.</text></g></svg>
  <div class="lg"><span><i style="background:var(--border)"></i>Attendu</span><span><i style="background:var(--brand)"></i>Reçu</span><span>Mois en cours en transparence</span></div></div>
 <div class="cz-card" style="flex:1.2;min-width:330px"><div class="ttl">Taux de recouvrement — couleur selon seuil</div>
  <div class="pv-row" style="justify-content:space-around">
   <div class="pv-item"><svg class="ring" viewBox="0 0 120 120" width="96"><circle class="trk" cx="60" cy="60" r="46" fill="none" stroke-width="13"/><circle class="ok" cx="60" cy="60" r="46" fill="none" stroke-width="13" stroke-dasharray="237 289" stroke-linecap="round" transform="rotate(-90 60 60)"/><text class="big" x="60" y="66" text-anchor="middle">82 %</text></svg><div class="pv-cap">≥ 80 % vert</div></div>
   <div class="pv-item"><svg class="ring" viewBox="0 0 120 120" width="96"><circle class="trk" cx="60" cy="60" r="46" fill="none" stroke-width="13"/><circle class="wa" cx="60" cy="60" r="46" fill="none" stroke-width="13" stroke-dasharray="185 289" stroke-linecap="round" transform="rotate(-90 60 60)"/><text class="big" x="60" y="66" text-anchor="middle">64 %</text></svg><div class="pv-cap">50–80 % orange</div></div>
   <div class="pv-item"><svg class="ring" viewBox="0 0 120 120" width="96"><circle class="trk" cx="60" cy="60" r="46" fill="none" stroke-width="13"/><circle class="ko" cx="60" cy="60" r="46" fill="none" stroke-width="13" stroke-dasharray="110 289" stroke-linecap="round" transform="rotate(-90 60 60)"/><text class="big" x="60" y="66" text-anchor="middle">38 %</text></svg><div class="pv-cap">&lt; 50 % rouge</div></div>
  </div></div>
 <div class="cz-card" style="flex:1;min-width:250px" data-theme="member"><div class="ttl">Cumul versé (souscripteur)</div>
  <svg class="cum" viewBox="0 0 230 110" width="100%"><path class="ar" d="M10 100 L45 88 L80 74 L115 62 L150 48 L185 40 L220 26 L220 100 Z"/><path class="ln" d="M10 100 L45 88 L80 74 L115 62 L150 48 L185 40 L220 26"/><path class="tg" d="M185 40 L220 12"/><circle class="pt" cx="220" cy="26" r="4"/></svg>
  <div class="lg">Pointillé : objectif restant · infobulle au survol de chaque point</div></div>
</div>
<script>window.Cotiz && window.Cotiz.hydrate();</script>
</body>
</html>
