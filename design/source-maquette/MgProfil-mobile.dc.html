<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mon profil (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F2ED;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#5B51C4;text-decoration:none}a:hover{color:#26215C}
input,textarea,select,button{font:inherit;color:inherit}
h2.t{margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:16px;color:#1B1830}
.m-lbl{font-size:12.5px;color:#6B6478}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-list{background:#FFFFFF;border-radius:14px;box-shadow:0 1px 3px rgba(40,30,80,0.06)}
.m-list > *{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-bottom:1px solid #F0EDF3;color:#2C2A38;box-sizing:border-box;width:100%;background:transparent;border-left:none;border-right:none;border-top:none;text-align:left}
.m-list > *:last-child{border-bottom:none}
.m-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.m-kpis .cz-kpi{padding:12px 14px}.m-kpis .cz-kpi .v{font-size:20px}
.m-hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.m-hscroll > *{flex-shrink:0;white-space:nowrap}
.m-sheet{background:#FFFFFF;width:100%;border-radius:20px 20px 0 0;padding:10px 18px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.m-grip{width:40px;height:4px;border-radius:999px;background:#E4E0EA;align-self:center}
.m-bar{position:absolute;left:0;right:0;bottom:0;z-index:25;background:#FFFFFF;border-top:1px solid #E4E0EA;padding:12px 16px 20px;display:flex;gap:8px}
.m-bar > *{flex:1;height:48px}
</style>
</helmet>
<div data-theme="manager" style="width: 100%; height: 844px; position: relative; display: flex; flex-direction: column; background: #F4F2ED; overflow: hidden; font-family: Inter, Arial, sans-serif;">
<header style="background: #FFFFFF; padding: 8px 6px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #E4E0EA; min-height: 60px; box-sizing: border-box; flex-shrink: 0;"><a href="MgPlus-mobile.dc.html" aria-label="Retour" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #2C2A38; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></a><div style="flex-grow: 1; min-width: 0; "><div style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px; color: #1B1830; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Mon profil</div></div></header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px 96px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<div class="cz-card" style="display: flex; align-items: center; gap: 12px;"><span class="cz-avatar cz-avatar--lg">AK</span><div><b style="display: block; font-family: Poppins, sans-serif; font-size: 17px; color: #1B1830;">Awa Koné</b><span class="cz-badge cz-badge--brand cz-badge--sm">Gestionnaire principale</span></div></div>
<div class="cz-card" style="display: flex; flex-direction: column; gap: 12px;"><h2 class="t">Mes informations</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"><label class="cz-field"><span class="cz-label">Prénom</span><input class="cz-input" value="Awa"></label><label class="cz-field"><span class="cz-label">Nom</span><input class="cz-input" value="Koné"></label></div>
<label class="cz-field"><span class="cz-label">Email de connexion</span><input class="cz-input" value="awa@entraide.ci"></label>
<label class="cz-field"><span class="cz-label">Téléphone</span><input class="cz-input" value="+225 07 08 09 10 11"></label>
<button type="button" class="cz-btn cz-btn--block">Enregistrer</button></div>
<div class="cz-card" style="display: flex; flex-direction: column; gap: 10px;">
<div class="m-row"><h2 class="t">Mot de passe</h2><sc-if value="{{pwClosed}}" hint-placeholder-val="{{ true }}"><button type="button" class="cz-btn cz-btn--secondary cz-btn--sm" onClick="{{openPw}}">Modifier</button></sc-if></div>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><div class="cz-alert cz-alert--success"><div>Mot de passe modifié.</div></div></sc-if>
<sc-if value="{{pwOpen}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 10px;">
<label class="cz-field"><span class="cz-label">Mot de passe actuel</span><input class="cz-input" type="password" value="motdepasse"></label>
<label class="cz-field"><span class="cz-label">Nouveau mot de passe</span><input class="cz-input" type="password" value="nouveaumotdepasse"><span class="cz-help">8 caractères minimum, dont un chiffre.</span></label>
<label class="cz-field"><span class="cz-label">Confirmer</span><input class="cz-input" type="password" value="nouveaumotdepasse"></label>
<div style="display: flex; gap: 8px;"><button type="button" class="cz-btn cz-btn--ghost" onClick="{{closePw}}" style="flex: 1;">Annuler</button><button type="button" class="cz-btn" onClick="{{savePw}}" style="flex: 1;">Changer</button></div></div></sc-if></div>
<div class="cz-notif-group">M’avertir quand…</div>
<div class="m-list"><sc-for list="{{prefs}}" as="p" hint-placeholder-count="3"><button type="button" onClick="{{p.toggle}}" style="cursor: pointer;"><span style="flex-grow: 1;"><b style="display: block; font-size: 14px; font-weight: 500; color: #1B1830;">{{p.t}}</b><span class="m-lbl">{{p.d}}</span></span><sc-if value="{{p.v2}}" hint-placeholder-val="{{ false }}"><span class="cz-soon" style="font-size: 11px; padding: 2px 8px;">V2</span></sc-if><span class="{{p.cls}}"></span></button></sc-for></div>
<a href="ConnexionAssociation-mobile.dc.html" class="cz-btn cz-btn--danger-outline cz-btn--block">Se déconnecter</a>
</div>
</div>
<dc-import name="MgMobNav" active="plus" hint-size="100%,72px" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat": {"editor": "enum", "options": ["nominal", "changement-mot-de-passe", "mot-de-passe-modifie"], "default": "nominal"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pw: null, done: null, n: [true, true, false] }; }
  renderVals() {
    const P = this.props, S = this.state;
    const M = (n) => n + '-mobile.dc.html';
    const ok = 'cz-badge cz-badge--success cz-badge--sm', bad = 'cz-badge cz-badge--danger cz-badge--sm', warn = 'cz-badge cz-badge--warning cz-badge--sm', info = 'cz-badge cz-badge--info cz-badge--sm';
    const stop = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };
    const etat = P.etat || 'nominal';
    const open = S.pw !== null ? S.pw : etat === 'changement-mot-de-passe';
    const done = S.done !== null ? S.done : etat === 'mot-de-passe-modifie';
    const PR = [['Un souscripteur déclare un paiement', 'Notification Cotiz'], ['Un souscripteur signe un contrat', 'Notification Cotiz'], ['Résumé quotidien par email', 'Paiements à valider, nouveaux retards', true]];
    const v = {
      pwOpen: open, pwClosed: !open, done,
      openPw: () => this.setState({ pw: true, done: false }), closePw: () => this.setState({ pw: false }), savePw: () => this.setState({ pw: false, done: true }),
      prefs: PR.map(([t, d, v2], i) => ({ t, d, v2: !!v2, cls: 'cz-toggle' + (S.n[i] ? ' is-on' : ''), toggle: () => { const n = S.n.slice(); n[i] = !n[i]; this.setState({ n }); } }))
    };
    return Object.assign({ stop, overlayStyle: 'position: absolute; inset: 0; z-index: 40; background: rgba(27,24,48,0.4); display: flex; align-items: flex-end;' }, v);
  }
}
</script>
</body>
</html>
