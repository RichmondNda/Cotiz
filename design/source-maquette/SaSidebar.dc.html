<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Barre latérale super-admin</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#6B6478;text-decoration:none}a:hover{color:#2A2552}
</style>
</helmet>
<nav data-theme="superadmin" aria-label="Navigation principale" style="width: 240px; height: 100%; min-height: 900px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E4E0EA; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; font-family: Inter, Arial, sans-serif;">
<a href="SaDashboard.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 12px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px; color: #26215C;">
<svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="sas-m"><rect width="100" height="100" fill="#fff"/><path d="M 61.9 29.3 A 23.9 23.9 0 1 0 61.9 70.7" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/></mask></defs><circle cx="50" cy="50" r="40" fill="#7F77DD" mask="url(#sas-m)"/><circle cx="75.5" cy="50" r="5" fill="#D85A30"/></svg>Cotiz</a>
<div style="margin: 0 8px 12px;"><span class="cz-badge cz-badge--brand"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.4-7.5 10-4.3-1.6-7.5-5.4-7.5-10v-6z"/><path d="M9 12l2 2 4-4"/></svg>Espace plateforme</span></div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"/></svg>
<span style="flex-grow: 1;">{{it.label}}</span>
<sc-if value="{{it.count}}" hint-placeholder-val="{{ false }}"><span class="cz-count">{{it.count}}</span></sc-if>
</a>
</sc-for>
<div style="flex-grow: 1;"></div>
<sc-for list="{{bottom}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"/></svg>
<span style="flex-grow: 1;">{{it.label}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","demandes","associations","plans","facturation","utilisateurs","profil"],"default":"dashboard"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'dashboard';
    const mk = (key, label, href, icon, count) => {
      const on = key === active;
      return {
        label, href, icon, count: count || false, current: on ? 'page' : 'false',
        style: `display: flex; align-items: center; gap: 10px; padding: 9px 11px; min-height: 40px; box-sizing: border-box; border-radius: 9px; font-size: 13.5px; ${on ? 'background: #E4E3EF; color: #2A2552; font-weight: 600;' : 'color: #6B6478;'}`
      };
    };
    return {
      items: [
        mk('dashboard', 'Tableau de bord', 'SaDashboard.dc.html', 'M3 3h7.5v9H3zM13.5 3H21v5h-7.5zM13.5 11H21v10h-7.5zM3 15h7.5v6H3z'),
        mk('demandes', 'Demandes', 'SaDemandes.dc.html', 'M14 3v5h5M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8zM8.5 14h7M8.5 17.5h4', '4'),
        mk('associations', 'Associations', 'SaAssociations.dc.html', 'M6.5 3h11A2.5 2.5 0 0 1 20 5.5v15.5H4V5.5A2.5 2.5 0 0 1 6.5 3zM9 21v-4h6v4M8.5 7.5h1M14.5 7.5h1M8.5 11.5h1M14.5 11.5h1'),
        mk('plans', 'Plans', 'SaPlans.dc.html', 'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5'),
        mk('facturation', 'Facturation', 'SaFacturation.dc.html', 'M5.5 3h13v18l-3-2-3.5 2-3.5-2-3 2zM9 8h6M9 12h6'),
        mk('utilisateurs', 'Utilisateurs', 'SaUtilisateurs.dc.html', 'M9 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM2.5 20a6.5 6.5 0 0 1 13 0M17 11.5a3 3 0 1 0 0-6M18 20a6 6 0 0 0-2.5-4.9')
      ],
      bottom: [
        mk('profil', 'Mon profil', 'SaProfil.dc.html', 'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4.5 20.5a7.5 7.5 0 0 1 15 0'),
        mk('logout', 'Se déconnecter', 'ConnexionPlateforme.dc.html', 'M9.5 20.5H6A2.5 2.5 0 0 1 3.5 18V6A2.5 2.5 0 0 1 6 3.5h3.5M15.5 16.5L20 12l-4.5-4.5M20 12H9.5')
      ]
    };
  }
}
</script>
</body>
</html>
