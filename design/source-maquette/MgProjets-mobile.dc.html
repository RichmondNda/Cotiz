<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Projets (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F2ED;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#5B51C4;text-decoration:none}a:hover{color:#26215C}
input,textarea,select,button{font:inherit;color:inherit}
h2.t{margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:16px;color:#1B1830}
.m-lbl{font-size:12.5px;color:#6B6478}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-list{background:#FFFFFF;border-radius:14px;box-shadow:0 1px 3px rgba(40,30,80,0.06)}
.m-list > *{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-bottom:1px solid #F0EDF3;color:#2C2A38;box-sizing:border-box;width:100%;background:transparent;border-left:none;border-right:none;border-top:none;text-align:left}
.m-list > *:last-child{border-bottom:none}
.m-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.m-kpis .cz-kpi{padding:12px 14px}.m-kpis .cz-kpi .v{font-size:20px}
.m-hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.m-hscroll > *{flex-shrink:0;white-space:nowrap}
.m-sheet{background:#FFFFFF;width:100%;border-radius:20px 20px 0 0;padding:10px 18px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.m-grip{width:40px;height:4px;border-radius:999px;background:#E4E0EA;align-self:center}
.m-bar{position:absolute;left:0;right:0;bottom:0;z-index:25;background:#FFFFFF;border-top:1px solid #E4E0EA;padding:12px 16px 20px;display:flex;gap:8px}
.m-bar > *{flex:1;height:48px}
</style>
</helmet>
<div data-theme="manager" style="width: 100%; height: 844px; position: relative; display: flex; flex-direction: column; background: #F4F2ED; overflow: hidden; font-family: Inter, Arial, sans-serif;">
<header style="background: #FFFFFF; padding: 8px 6px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #E4E0EA; min-height: 60px; box-sizing: border-box; flex-shrink: 0;"><div style="flex-grow: 1; min-width: 0; padding-left: 10px;"><div style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px; color: #1B1830; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Projets</div><div style="font-size: 12.5px; color: #6B6478; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">3 projets</div></div><a href="MgNouveauProjet-mobile.dc.html" class="cz-btn cz-btn--sm" style="color: #FFFFFF;" aria-label="Nouveau projet">+ Nouveau</a><a href="MgNotifications-mobile.dc.html" aria-label="Notifications : 3 non lues" style="position: relative; color: #6B6478; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6c0 4-2 5-2 5h16s-2-1-2-5a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0"/></svg><span class="cz-count cz-count--danger" style="position: absolute; top: 5px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; font-size: 10px;">3</span></a></header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px 96px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<div class="m-hscroll"><sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><button type="button" class="{{c.cls}}" onClick="{{c.pick}}" style="min-height: 38px;">{{c.label}}</button></sc-for></div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div class="cz-card cz-card--lg"><div class="cz-empty"><div class="t">Aucun projet</div><div class="d">Créez un projet pour commencer à suivre les cotisations.</div><a class="cz-btn" href="MgNouveauProjet-mobile.dc.html" style="color: #FFFFFF; margin-top: 8px;">Nouveau projet</a></div></div></sc-if>
<sc-if value="{{noResult}}" hint-placeholder-val="{{ false }}"><div class="cz-card cz-card--lg"><div class="cz-empty"><div class="t">Aucun projet dans ce filtre</div><button type="button" class="cz-btn cz-btn--secondary" onClick="{{reset}}" style="margin-top: 8px;">Voir tous les projets</button></div></div></sc-if>
<sc-for list="{{rows}}" as="p" hint-placeholder-count="3">
<a class="cz-card" href="MgProjet-mobile.dc.html" style="color: inherit; display: flex; flex-direction: column; gap: 10px;">
<div class="m-row"><div style="min-width: 0;"><b style="display: block; font-family: Poppins, sans-serif; font-size: 15.5px; color: #1B1830;">{{p.name}}</b><span class="m-lbl">{{p.sub}}</span></div><span class="{{p.badgeCls}}">{{p.status}}</span></div>
<div class="{{p.barCls}}"><i style="{{p.barW}}"></i></div>
<div class="m-row" style="font-size: 12.5px;"><span style="color: #6B6478;">{{p.progress}}</span><b>{{p.pct}}</b></div>
<div class="m-row" style="padding-top: 8px; border-top: 1px solid #F0EDF3; font-size: 12.5px;"><span style="color: #6B6478;">{{p.subs}} souscripteurs · {{p.footer}}</span><span class="{{p.alertCls}}">{{p.alert}}</span></div>
</a>
</sc-for>
</div>
</div>
<dc-import name="MgMobNav" active="projets" hint-size="100%,72px" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat": {"editor": "enum", "options": ["nominal", "vide", "filtre-sans-resultat"], "default": "nominal"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: null }; }
  renderVals() {
    const P = this.props, S = this.state;
    const M = (n) => n + '-mobile.dc.html';
    const ok = 'cz-badge cz-badge--success cz-badge--sm', bad = 'cz-badge cz-badge--danger cz-badge--sm', warn = 'cz-badge cz-badge--warning cz-badge--sm', info = 'cz-badge cz-badge--info cz-badge--sm';
    const stop = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };
    const etat = P.etat || 'nominal';
    const L = [
      { name: 'Centre communautaire', sub: 'Mensuel · 25 000 F · depuis mars 2026', k: 'run', subs: '52', progress: '9 594 000 F collectés', pct: '37 %', barW: 'width: 37%;', barCls: 'cz-bar', footer: 'prochaine : 5 oct.', alert: '14 en retard', alertCls: bad },
      { name: 'Voyage solidaire', sub: 'Mensuel · 10 000 F · 12 mois', k: 'run', subs: '[N]', progress: '[MONTANT] F collectés', pct: '[N] %', barW: 'width: 30%;', barCls: 'cz-bar', footer: 'prochaine : 5 oct.', alert: '1 signature', alertCls: warn },
      { name: 'Tontine solidaire 2027', sub: 'Cycle roulant · 10 000 F', k: 'open', subs: '12 / 30', progress: '12 / 30 souscripteurs', pct: '40 %', barW: 'width: 40%;', barCls: 'cz-bar cz-bar--info', footer: 'démarre en janv. 2027', alert: 'Inscriptions', alertCls: info }
    ];
    const B = { run: ['cz-badge cz-badge--success cz-badge--sm', 'En cours'], open: ['cz-badge cz-badge--info cz-badge--sm', 'Inscriptions ouvertes'] };
    const filter = S.filter || (etat === 'filtre-sans-resultat' ? 'done' : 'all');
    const rows = etat === 'vide' ? [] : L.filter((p) => filter === 'all' || p.k === filter);
    const v = {
      chips: [['all', 'Tous · 3'], ['run', 'En cours · 2'], ['open', 'Inscriptions · 1'], ['draft', 'Brouillons · 0'], ['done', 'Terminés · 0']].map(([k, l]) => ({ label: l, cls: 'cz-chip' + (k === filter ? ' is-on' : ''), pick: () => this.setState({ filter: k }) })),
      rows: rows.map((p) => ({ ...p, badgeCls: B[p.k][0], status: B[p.k][1] })),
      empty: etat === 'vide', noResult: rows.length === 0 && etat !== 'vide', reset: () => this.setState({ filter: 'all' })
    };
    return Object.assign({ stop, overlayStyle: 'position: absolute; inset: 0; z-index: 40; background: rgba(27,24,48,0.4); display: flex; align-items: flex-end;' }, v);
  }
}
</script>
</body>
</html>
