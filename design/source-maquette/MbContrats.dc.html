<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes contrats</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FAECE7;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#993C1D;text-decoration:none}a:hover{color:#26215C}
input,textarea,select,button{font:inherit;color:inherit}
h2.t{margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:18px;color:#1B1830}
.mb-lbl{font-size:12.5px;color:#6B6478}
.mb-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mb-list{background:#FFFFFF;border-radius:14px;box-shadow:0 1px 3px rgba(40,30,80,0.06)}
.mb-list > *{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-bottom:1px solid #F0EDF3;color:#2C2A38;box-sizing:border-box}
.mb-list > *:last-child{border-bottom:none}
</style>
</helmet>

<div data-theme="member" style="{{s.root}}">
<dc-import name="MbNav" device="{{device}}" active="profil" fab="{{ false }}" hint-size="{{s.navHint}}" style="{{s.nav}}"></dc-import>
<div style="{{s.col}}">
<sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}"><header style="background: #FFFFFF; padding: 8px 8px 8px 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E4E0EA; min-height: 60px; box-sizing: border-box; flex-shrink: 0;"><a href="{{links.back}}" aria-label="Retour" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #2C2A38; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></a><div style="flex-grow: 1; min-width: 0; "><div style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px; color: #1B1830; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Mes contrats</div><div style="font-size: 12.5px; color: #6B6478;">3 contrats · 2 associations</div></div></header></sc-if>
<div style="{{s.scroll}}">
<div style="{{s.inner}}">
<sc-if value="{{web}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;"><div><a href="{{links.back}}" style="display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 600; margin-bottom: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>Retour</a><h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 28px; color: #1B1830;">Mes contrats</h1><p style="margin: 4px 0 0; font-size: 14px; color: #6B6478;">3 contrats · 2 associations</p></div></div></sc-if>
<sc-if value="{{toSign}}" hint-placeholder-val="{{ true }}">
<a href="{{links.contrat}}" class="cz-card" style="display: flex; align-items: center; gap: 12px; border: 2px solid #E8963C; color: inherit;">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #FBEEDB; color: #8A5410; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v5h5M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8zM8.5 14h7M8.5 17.5h4"/></svg></span>
<span style="flex-grow: 1; min-width: 0;"><b style="display: block; font-size: 15px; color: #1B1830;">Voyage solidaire</b><span class="mb-lbl">Entraide Yopougon · 170 000 F</span><span class="cz-badge cz-badge--warning cz-badge--sm" style="margin-top: 6px;">À signer</span></span>
<span class="cz-btn cz-btn--sm">Signer</span></a>
</sc-if>
<div class="cz-notif-group">Contrats signés</div>
<div class="mb-list">
<sc-for list="{{signed}}" as="c" hint-placeholder-count="2">
<a href="{{c.href}}"><span style="width: 40px; height: 40px; border-radius: 12px; background: #DFF3E7; color: #1E6B3E; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v5h5M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8zM9 14l2 2 4-4"/></svg></span><span style="flex-grow: 1; min-width: 0;"><b style="display: block; font-size: 14.5px; color: #1B1830;">{{c.name}}</b><span class="mb-lbl">{{c.asso}} · signé le {{c.date}}</span></span><span class="cz-badge cz-badge--success cz-badge--sm">Signé</span></a>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: #6B6478;">Touchez un contrat pour le relire ou télécharger sa version signée (PDF).</p>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device": {"editor": "enum", "options": ["web", "mobile"], "default": "web"}, "etat": {"editor": "enum", "options": ["nominal", "tout-signe"], "default": "nominal"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  renderVals() {
    const m = (this.props.device || 'web') === 'mobile';
    const L = (n) => n + (m ? '-mobile' : '') + '.dc.html';
    const P = this.props, S = this.state;
    const fmt = (x) => String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' F';
    const ok = 'cz-badge cz-badge--success cz-badge--sm', bad = 'cz-badge cz-badge--danger cz-badge--sm', warn = 'cz-badge cz-badge--warning cz-badge--sm', info = 'cz-badge cz-badge--info cz-badge--sm';
    const all = (P.etat || 'nominal') === 'tout-signe';
    const signed = [
      { name: 'Centre communautaire', asso: 'Entraide Yopougon', date: '12/03/2026', href: L('MbContrat') },
      { name: 'Mutuelle santé', asso: 'Assoc. des ressortissants de Man', date: '01/07/2026', href: L('MbContrat') }
    ];
    if (all) signed.unshift({ name: 'Voyage solidaire', asso: 'Entraide Yopougon', date: '25/09/2026', href: L('MbContrat') });
    const v = { toSign: !all, signed, links: { back: L('MbProfil'), contrat: L('MbContrat') } };
    const hasNav = true && !(m && false && !v.forceNav);
    const s = {
      root: m ? 'width: 100%; height: 844px; position: relative; display: flex; flex-direction: column; background: #FAECE7; overflow: hidden; font-family: Inter, Arial, sans-serif;'
              : 'width: 100%; height: 900px; position: relative; display: grid; grid-template-columns: ' + (true ? '240px ' : '') + 'minmax(0, 1fr); background: #FAECE7; overflow: hidden; font-family: Inter, Arial, sans-serif;',
      nav: m ? 'position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;' : 'height: 100%;',
      navHint: m ? '100%,80px' : '240px,100%',
      col: m ? 'flex: 1; min-height: 0; display: flex; flex-direction: column;' : 'min-width: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden;',
      scroll: m ? 'flex: 1; overflow-y: auto; padding: 14px 12px ' + (hasNav ? '100px' : '24px') + ';' : 'flex: 1; overflow-y: auto; padding: 32px 48px;',
      inner: m ? 'display: flex; flex-direction: column; gap: 14px;' : 'max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;',
      bar: m ? 'position: absolute; left: 0; right: 0; bottom: 0; z-index: 25; background: #FFFFFF; border-top: 1px solid #E4E0EA; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px;' : 'display: flex; justify-content: flex-end; gap: 10px; padding-top: 4px;',
      two: m ? 'display: flex; flex-direction: column; gap: 14px;' : 'display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;',
      three: m ? 'display: flex; flex-direction: column; gap: 12px;' : 'display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;',
      overlay: 'position: absolute; inset: 0; z-index: 40; background: rgba(27,24,48,0.4); display: flex; ' + (m ? 'align-items: flex-end;' : 'align-items: center; justify-content: center;'),
      sheet: m ? 'background: #FFFFFF; width: 100%; border-radius: 20px 20px 0 0; padding: 10px 18px 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow-y: auto;' : 'background: #FFFFFF; width: 480px; border-radius: 16px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(27,24,48,0.25);'
    };
    return Object.assign({ device: m ? 'mobile' : 'web', mobile: m, web: !m, showNav: hasNav }, v, { s: Object.assign(s, v.s || {}), links: Object.assign({ back: L('MbAccueil') }, v.links || {}) });
  }
}
</script>
</body>
</html>
