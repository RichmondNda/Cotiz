<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cotiz — Administration (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#F2F2F8;font-family:Inter,Arial,sans-serif;color:#2C2A38}a{color:#3B3470;text-decoration:none}a:hover{color:#2A2552}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F2F2F8;">
<dc-import name="ConnexionPlateforme" device="mobile" etat="{{etat}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","options":["nominal","erreur","code-verification"],"default":"nominal"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { etat: this.props.etat || 'nominal' }; }
}
</script>
</body>
</html>
