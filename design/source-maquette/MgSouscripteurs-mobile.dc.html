<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Souscripteurs (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F2ED;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#5B51C4;text-decoration:none}a:hover{color:#26215C}
input,textarea,select,button{font:inherit;color:inherit}
h2.t{margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:16px;color:#1B1830}
.m-lbl{font-size:12.5px;color:#6B6478}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-list{background:#FFFFFF;border-radius:14px;box-shadow:0 1px 3px rgba(40,30,80,0.06)}
.m-list > *{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-bottom:1px solid #F0EDF3;color:#2C2A38;box-sizing:border-box;width:100%;background:transparent;border-left:none;border-right:none;border-top:none;text-align:left}
.m-list > *:last-child{border-bottom:none}
.m-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.m-kpis .cz-kpi{padding:12px 14px}.m-kpis .cz-kpi .v{font-size:20px}
.m-hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.m-hscroll > *{flex-shrink:0;white-space:nowrap}
.m-sheet{background:#FFFFFF;width:100%;border-radius:20px 20px 0 0;padding:10px 18px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.m-grip{width:40px;height:4px;border-radius:999px;background:#E4E0EA;align-self:center}
.m-bar{position:absolute;left:0;right:0;bottom:0;z-index:25;background:#FFFFFF;border-top:1px solid #E4E0EA;padding:12px 16px 20px;display:flex;gap:8px}
.m-bar > *{flex:1;height:48px}
</style>
</helmet>
<div data-theme="manager" style="width: 100%; height: 844px; position: relative; display: flex; flex-direction: column; background: #F4F2ED; overflow: hidden; font-family: Inter, Arial, sans-serif;">
<header style="background: #FFFFFF; padding: 8px 6px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #E4E0EA; min-height: 60px; box-sizing: border-box; flex-shrink: 0;"><div style="flex-grow: 1; min-width: 0; padding-left: 10px;"><div style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px; color: #1B1830; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Souscripteurs</div><div style="font-size: 12.5px; color: #6B6478; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">52 membres · tous projets</div></div><a href="MgNotifications-mobile.dc.html" aria-label="Notifications : 3 non lues" style="position: relative; color: #6B6478; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6c0 4-2 5-2 5h16s-2-1-2-5a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0"/></svg><span class="cz-count cz-count--danger" style="position: absolute; top: 5px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; font-size: 10px;">3</span></a></header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px 96px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<label class="cz-input cz-search"><input placeholder="Nom ou téléphone" aria-label="Rechercher" style="border: none; outline: none; background: transparent; flex-grow: 1; min-width: 0;"></label>
<div class="m-hscroll"><sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><button type="button" class="{{c.cls}}" onClick="{{c.pick}}" style="min-height: 38px;">{{c.label}}</button></sc-for></div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div class="cz-card cz-card--lg"><div class="cz-empty"><div class="t">Aucun souscripteur pour l’instant</div><div class="d">Les membres apparaissent ici dès que vous les ajoutez à un projet.</div><a class="cz-btn" href="MgProjets-mobile.dc.html" style="color: #FFFFFF; margin-top: 8px;">Voir mes projets</a></div></div></sc-if>
<sc-if value="{{notEmpty}}" hint-placeholder-val="{{ true }}"><div class="m-list"><sc-for list="{{rows}}" as="r" hint-placeholder-count="9"><a href="MgSouscripteur-mobile.dc.html"><span class="{{r.avCls}}">{{r.ini}}</span><span style="flex-grow: 1; min-width: 0;"><b style="display: block; font-size: 14px; color: #1B1830;">{{r.name}}</b><span class="m-lbl">{{r.proj}} · reste {{r.rest}}</span></span><span class="{{r.badgeCls}}">{{r.status}}</span></a></sc-for></div>
<div class="m-lbl" style="text-align: center;">{{count}} affichés sur 52</div></sc-if>
</div>
</div>
<dc-import name="MgMobNav" active="membres" hint-size="100%,72px" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat": {"editor": "enum", "options": ["nominal", "vide"], "default": "nominal"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all' }; }
  renderVals() {
    const P = this.props, S = this.state;
    const M = (n) => n + '-mobile.dc.html';
    const ok = 'cz-badge cz-badge--success cz-badge--sm', bad = 'cz-badge cz-badge--danger cz-badge--sm', warn = 'cz-badge cz-badge--warning cz-badge--sm', info = 'cz-badge cz-badge--info cz-badge--sm';
    const stop = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };
    const etat = P.etat || 'nominal';
    const R = [
      ['MD', 'Moussa Diarra', 'Centre, Voyage', '325 000 F', 'late', 'En retard'], ['KB', 'Koffi Brou', 'Centre', '325 000 F', 'late', 'En retard'], ['JK', 'Jean Kouassi', 'Centre', '287 500 F', 'late', 'En retard'],
      ['FT', 'Fatou Traoré', 'Centre', '500 000 F', 'sign', 'À signer'], ['AK', 'Awa Koné', 'Centre', '300 000 F', 'ok', 'À jour'], ['KS', 'Kadiatou Sanogo', 'Centre, Tontine', '300 000 F', 'ok', 'À jour'],
      ['SG', 'Serge Gnagne', 'Centre', '300 000 F', 'ok', 'À jour'], ['IT', 'Ibrahim Touré', 'Voyage', '[MONTANT] F', 'ok', 'À jour'], ['AY', 'Adjoua Yao', 'Voyage', '170 000 F', 'ok', 'À jour']
    ].map(([ini, name, proj, rest, k, status]) => ({ ini, name, proj, rest, k, status }));
    const C = { late: [bad, 'cz-avatar cz-avatar--sm cz-avatar--danger'], ok: [ok, 'cz-avatar cz-avatar--sm'], sign: [warn, 'cz-avatar cz-avatar--sm cz-avatar--warning'] };
    const rows = R.filter((r) => S.f === 'all' || r.k === S.f);
    const v = {
      empty: etat === 'vide', notEmpty: etat !== 'vide',
      chips: [['all', 'Tous · 52'], ['late', 'En retard · 14'], ['ok', 'À jour'], ['sign', 'À signer']].map(([k, l]) => ({ label: l, cls: 'cz-chip' + (S.f === k ? ' is-on' : ''), pick: () => this.setState({ f: k }) })),
      rows: rows.map((r) => ({ ...r, badgeCls: C[r.k][0], avCls: C[r.k][1] })), count: String(rows.length)
    };
    return Object.assign({ stop, overlayStyle: 'position: absolute; inset: 0; z-index: 40; background: rgba(27,24,48,0.4); display: flex; align-items: flex-end;' }, v);
  }
}
</script>
</body>
</html>
