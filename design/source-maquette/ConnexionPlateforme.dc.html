<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cotiz — Administration</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F2F2F8;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#3B3470;text-decoration:none}a:hover{color:#2A2552}
input{font:inherit;color:inherit}
</style>
</helmet>
<div data-theme="superadmin" style="{{s.root}}">
<div style="{{s.card}}">
<div style="display: flex; align-items: center; gap: 10px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 20px; color: #26215C;">
<svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="cp-m"><rect width="100" height="100" fill="#fff"/><path d="M 61.9 29.3 A 23.9 23.9 0 1 0 61.9 70.7" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/></mask></defs><circle cx="50" cy="50" r="40" fill="#7F77DD" mask="url(#cp-m)"/><circle cx="75.5" cy="50" r="5" fill="#D85A30"/></svg>Cotiz
<span class="cz-badge cz-badge--brand" style="margin-left: auto;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.4-7.5 10-4.3-1.6-7.5-5.4-7.5-10v-6z"/><path d="M9 12l2 2 4-4"/></svg>Plateforme</span>
</div>
<sc-if value="{{credsStep}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 24px; color: #1B1830;">Administration Cotiz</h1>
<sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
<div class="cz-alert cz-alert--danger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V13M12 16.3v.2"/></svg><div><b>Identifiants incorrects.</b> Réessayez.</div></div>
</sc-if>
<label class="cz-field"><span class="cz-label">Email</span><input class="{{inCls}}" type="email" value="richy@cotiz.app"></label>
<label class="cz-field"><span class="cz-label">Mot de passe</span><input class="{{inCls}}" type="password" value="motdepasse"></label>
<a class="cz-btn cz-btn--block" href="SaDashboard.dc.html" style="height: 46px;">Se connecter</a>
</div>
</sc-if>
<sc-if value="{{codeStep}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: center; gap: 8px;"><h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 22px; color: #1B1830;">Code de vérification</h1><span class="cz-soon" style="font-size: 11px; padding: 2px 8px;">V2</span></div>
<p style="margin: 0; font-size: 14px; color: #6B6478;">Saisissez le code à 6 chiffres envoyé sur votre application d’authentification.</p>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
<input aria-label="Chiffre 1" class="cz-input" value="4" maxlength="1" inputmode="numeric" style="height: 54px; text-align: center; font-family: Poppins, sans-serif; font-size: 22px; padding: 0;">
<input aria-label="Chiffre 2" class="cz-input" value="8" maxlength="1" inputmode="numeric" style="height: 54px; text-align: center; font-family: Poppins, sans-serif; font-size: 22px; padding: 0;">
<input aria-label="Chiffre 3" class="cz-input" value="1" maxlength="1" inputmode="numeric" style="height: 54px; text-align: center; font-family: Poppins, sans-serif; font-size: 22px; padding: 0;">
<input aria-label="Chiffre 4" class="cz-input is-focus" value="" maxlength="1" inputmode="numeric" style="height: 54px; text-align: center; font-family: Poppins, sans-serif; font-size: 22px; padding: 0;">
<input aria-label="Chiffre 5" class="cz-input" value="" maxlength="1" inputmode="numeric" style="height: 54px; text-align: center; font-family: Poppins, sans-serif; font-size: 22px; padding: 0;">
<input aria-label="Chiffre 6" class="cz-input" value="" maxlength="1" inputmode="numeric" style="height: 54px; text-align: center; font-family: Poppins, sans-serif; font-size: 22px; padding: 0;">
</div>
<a class="cz-btn cz-btn--block" href="SaDashboard.dc.html" style="height: 46px;">Valider</a>
<button type="button" class="cz-btn cz-btn--ghost cz-btn--block" onClick="{{backToCreds}}">Retour</button>
</div>
</sc-if>
<p style="margin: 0; font-size: 12px; color: #6B6478; text-align: center;">Accès réservé à l’équipe Cotiz.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["web","mobile"],"default":"web"},"etat":{"editor":"enum","options":["nominal","erreur","code-verification"],"default":"nominal"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { code: null }; }
  renderVals() {
    const m = this.props.device === 'mobile';
    const etat = this.props.etat || 'nominal';
    const code = this.state.code === null ? etat === 'code-verification' : this.state.code;
    const error = etat === 'erreur' && !code;
    return {
      credsStep: !code, codeStep: code, error,
      inCls: 'cz-input' + (error ? ' is-error' : ''),
      toCode: () => this.setState({ code: true }),
      backToCreds: () => this.setState({ code: false }),
      s: {
        root: `width: 100%; height: ${m ? 844 : 900}px; background: #F2F2F8; display: flex; align-items: center; justify-content: center; padding: ${m ? '16px' : '48px'}; box-sizing: border-box; font-family: Inter, Arial, sans-serif;`,
        card: `width: ${m ? '100%' : '420px'}; box-sizing: border-box; background: #FFFFFF; border-radius: 16px; padding: ${m ? '24px 18px' : '32px'}; box-shadow: 0 2px 10px rgba(40,30,80,0.07); display: flex; flex-direction: column; gap: 20px;`
      }
    };
  }
}
</script>
</body>
</html>
