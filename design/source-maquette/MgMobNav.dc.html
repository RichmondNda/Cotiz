<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Navigation gestionnaire (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif}a{text-decoration:none}</style>
</helmet>
<nav data-theme="manager" aria-label="Navigation principale" style="background: #FFFFFF; border-top: 1px solid #E4E0EA; display: flex; justify-content: space-around; padding: 6px 0 12px; font-family: Inter, Arial, sans-serif;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}"><span style="{{it.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"/></svg><sc-if value="{{it.count}}" hint-placeholder-val="{{ false }}"><span class="cz-count cz-count--danger" style="position: absolute; top: -4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; font-size: 10px;">{{it.count}}</span></sc-if></span>{{it.label}}</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["accueil","projets","paiements","membres","plus","none"],"default":"accueil"},"$preview":{"width":390,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'accueil';
    const I = [
      ['accueil', 'Accueil', 'MgDashboard', 'M3 3h7.5v9H3zM13.5 3H21v5h-7.5zM13.5 11H21v10h-7.5zM3 15h7.5v6H3z'],
      ['projets', 'Projets', 'MgProjets', 'M12 3l2.6 5.5 6 .9-4.3 4.3 1 6L12 17l-5.3 2.7 1-6L3.4 9.4l6-.9z'],
      ['paiements', 'Paiements', 'MgPaiements', 'M5.5 5.5h13a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-13a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3zM2.5 10h19M6 15h4', '6'],
      ['membres', 'Membres', 'MgSouscripteurs', 'M9 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM2.5 20a6.5 6.5 0 0 1 13 0M17 11.5a3 3 0 1 0 0-6M18 20a6 6 0 0 0-2.5-4.9'],
      ['plus', 'Plus', 'MgPlus', 'M4 6h16M4 12h16M4 18h16']
    ];
    return {
      items: I.map(([k, label, f, icon, count]) => {
        const on = k === a;
        return { label, icon, href: f + '-mobile.dc.html', count: count || false, current: on ? 'page' : 'false',
          style: `display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 48px; justify-content: center; font-size: 10.5px; font-weight: 600; color: ${on ? '#5B51C4' : '#6B6478'};`,
          pill: `position: relative; display: inline-flex; padding: 3px 14px; border-radius: 999px; background: ${on ? '#EFECFB' : 'transparent'};` };
      })
    };
  }
}
</script>
</body>
</html>
