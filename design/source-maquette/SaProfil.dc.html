<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plateforme — Mon profil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F2F2F8;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#3B3470;text-decoration:none}a:hover{color:#2A2552}
input{font:inherit;color:inherit}
h2.t{margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:16px;color:#1B1830}
</style>
</helmet>
<div data-theme="superadmin" style="width: 1440px; height: 1100px; display: grid; grid-template-columns: 240px minmax(0, 1fr); background: #F2F2F8; font-family: Inter, Arial, sans-serif; overflow: hidden;">
<dc-import name="SaSidebar" active="profil" hint-size="240px,1100px" style="height: 100%;"></dc-import>
<div style="display: flex; flex-direction: column; min-width: 0;">
<dc-import name="SaTopbar" current="Mon profil" hint-size="100%,64px"></dc-import>
<main style="padding: 24px 32px; display: flex; flex-direction: column; gap: 16px; max-width: 820px;">
<div class="cz-pagehead"><div><h1>Mon profil</h1><p>Informations de votre compte d’administration.</p></div></div>
<sc-if value="{{saved}}" hint-placeholder-val="{{ false }}"><div class="cz-toast" role="status"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/></svg></span><div><div class="ttl">Modifications enregistrées</div></div></div></sc-if>
<section class="cz-card" style="padding: 22px; display: flex; flex-direction: column; gap: 14px;">
<h2 class="t">Informations personnelles</h2>
<div style="display: flex; align-items: center; gap: 14px;"><span class="cz-avatar cz-avatar--lg" style="background: #E4E3EF; color: #2A2552;">R</span><button type="button" class="cz-btn cz-btn--secondary cz-btn--sm">Changer la photo</button></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
<label class="cz-field"><span class="cz-label">Prénom</span><input class="cz-input" value="Richy"></label>
<label class="cz-field"><span class="cz-label">Nom</span><input class="cz-input" value="[Nom]"></label>
<label class="cz-field"><span class="cz-label">Email</span><input class="cz-input" value="[email]"></label>
<label class="cz-field"><span class="cz-label">Rôle</span><input class="cz-input is-disabled" value="Propriétaire" disabled></label>
</div>
<button type="button" class="cz-btn" onClick="{{save}}" style="align-self: flex-end;">Enregistrer</button>
</section>
<section class="cz-card" style="padding: 22px; display: flex; flex-direction: column; gap: 14px;">
<h2 class="t">Mot de passe</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">
<label class="cz-field"><span class="cz-label">Mot de passe actuel</span><input class="cz-input" type="password" value="motdepasse"></label>
<label class="cz-field"><span class="cz-label">Nouveau mot de passe</span><input class="cz-input" type="password"></label>
<label class="cz-field"><span class="cz-label">Confirmation</span><input class="cz-input" type="password"></label>
</div>
<button type="button" class="cz-btn cz-btn--secondary" style="align-self: flex-end;">Mettre à jour le mot de passe</button>
</section>
<section class="cz-card" style="padding: 22px; display: flex; align-items: center; gap: 16px;">
<div style="flex-grow: 1;"><div style="display: flex; align-items: center; gap: 8px;"><h2 class="t">Double authentification</h2><span class="cz-soon" style="font-size: 11px; padding: 1px 8px;">V2</span></div><p style="margin: 4px 0 0; font-size: 13.5px; color: #6B6478;">Un code à 6 chiffres sera demandé à chaque connexion.</p></div>
<button type="button" class="cz-btn cz-btn--secondary" disabled>Activer</button>
</section>
<section class="cz-card" style="padding: 22px; display: flex; flex-direction: column; gap: 6px;">
<h2 class="t" style="margin-bottom: 8px;">Préférences de notification</h2>
<sc-for list="{{prefs}}" as="p" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px;"><button type="button" role="switch" aria-checked="{{p.on}}" aria-label="{{p.label}}" onClick="{{p.toggle}}" class="{{p.cls}}" style="border: none; cursor: pointer;"></button><span style="font-size: 14px;">{{p.label}}</span></div>
</sc-for>
</section>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { saved: false, prefs: [true, true, false, true] }; }
  renderVals() {
    const L = ['Nouvelle demande de création', 'Abonnement impayé', 'Nouvelle association active', 'Résumé hebdomadaire par email'];
    return {
      saved: this.state.saved, save: () => this.setState({ saved: true }),
      prefs: L.map((label, i) => ({
        label, on: this.state.prefs[i], cls: 'cz-toggle' + (this.state.prefs[i] ? ' is-on' : ''),
        toggle: () => { const p = this.state.prefs.slice(); p[i] = !p[i]; this.setState({ prefs: p }); }
      }))
    };
  }
}
</script>
</body>
</html>
