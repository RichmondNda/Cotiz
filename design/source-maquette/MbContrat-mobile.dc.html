<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MbContrat (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#FAECE7;font-family:Inter,Arial,sans-serif;color:#2C2A38}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #FAECE7;">
<dc-import name="MbContrat" device="mobile" etat="{{etat}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat": {"editor": "enum", "options": ["lecture", "case-cochee", "signe", "consultation"], "default": "lecture"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return { etat: this.props.etat || 'lecture' }; }
}
</script>
</body>
</html>
