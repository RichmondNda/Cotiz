<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>En-tête public</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#5B51C4;text-decoration:none}a:hover{color:#26215C}
</style>
</helmet>
<div data-theme="manager" style="width: 100%; position: relative; z-index: 20; font-family: Inter, Arial, sans-serif;">
<sc-if value="{{web}}" hint-placeholder-val="{{ true }}">
<header style="height: 72px; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; gap: 32px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(40,30,80,0.07);">
<a href="{{links.home}}" style="display: flex; align-items: center; gap: 10px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 21px; color: #26215C;">
<svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="hdr-m"><rect width="100" height="100" fill="#fff"/><path d="M 61.9 29.3 A 23.9 23.9 0 1 0 61.9 70.7" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/></mask></defs><circle cx="50" cy="50" r="40" fill="#7F77DD" mask="url(#hdr-m)"/><circle cx="75.5" cy="50" r="5" fill="#D85A30"/></svg>
Cotiz</a>
<nav style="display: flex; gap: 28px; margin: 0 auto; font-size: 14.5px;">
<a href="{{links.fonctionnement}}" style="color: #2C2A38;">Fonctionnement</a>
<a href="{{links.tarifs}}" style="color: #2C2A38;">Tarifs</a>
<a href="{{links.faq}}" style="color: #2C2A38;">FAQ</a>
</nav>
<div style="display: flex; gap: 12px; align-items: center; position: relative;">
<button type="button" class="cz-btn cz-btn--secondary" onClick="{{toggleLogin}}" aria-expanded="{{loginOpen}}">Se connecter
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></button>
<a class="cz-btn" href="{{links.demande}}" style="color: #FFFFFF;">Créer mon association</a>
<sc-if value="{{loginOpen}}" hint-placeholder-val="{{ false }}">
<div class="cz-menu" style="position: absolute; top: 52px; left: 0; width: 250px;">
<a class="it" href="{{links.connexionAsso}}" style="color: #2C2A38;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5B51C4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 11.5a3 3 0 1 0 0-6M18 20a6 6 0 0 0-2.5-4.9"/></svg>Je suis gestionnaire</a>
<a class="it" href="{{links.connexion}}" style="color: #2C2A38;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D85A30" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.4-7.5-9.6A4.2 4.2 0 0 1 12 8.3a4.2 4.2 0 0 1 7.5 2.6c0 5.2-7.5 9.6-7.5 9.6z"/></svg>Je suis souscripteur</a>
</div>
</sc-if>
</div>
</header>
</sc-if>
<sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}">
<header style="height: 64px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; box-shadow: 0 2px 10px rgba(40,30,80,0.07);">
<a href="{{links.home}}" style="display: flex; align-items: center; gap: 8px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 19px; color: #26215C;">
<svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="hdr-mm"><rect width="100" height="100" fill="#fff"/><path d="M 61.9 29.3 A 23.9 23.9 0 1 0 61.9 70.7" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/></mask></defs><circle cx="50" cy="50" r="40" fill="#7F77DD" mask="url(#hdr-mm)"/><circle cx="75.5" cy="50" r="5" fill="#D85A30"/></svg>
Cotiz</a>
<button type="button" class="cz-btn cz-btn--icon" onClick="{{toggleNav}}" aria-label="Ouvrir le menu" style="width: 44px; height: 44px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
</header>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 64px; left: 0; right: 0; background: #FFFFFF; box-shadow: 0 8px 24px rgba(40,30,80,0.14); padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 4px;">
<a href="{{links.fonctionnement}}" style="color: #2C2A38; padding: 12px 4px; font-size: 16px; border-bottom: 1px solid #F2EFF5;">Fonctionnement</a>
<a href="{{links.tarifs}}" style="color: #2C2A38; padding: 12px 4px; font-size: 16px; border-bottom: 1px solid #F2EFF5;">Tarifs</a>
<a href="{{links.faq}}" style="color: #2C2A38; padding: 12px 4px; font-size: 16px; border-bottom: 1px solid #F2EFF5;">FAQ</a>
<div style="font-family: Poppins, sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; color: #6B6478; padding: 14px 4px 4px;">SE CONNECTER</div>
<a class="cz-btn cz-btn--secondary cz-btn--block" href="{{links.connexionAsso}}" style="height: 48px;">Je suis gestionnaire</a>
<a class="cz-btn cz-btn--secondary cz-btn--block" href="{{links.connexion}}" style="height: 48px; margin-top: 6px;">Je suis souscripteur</a>
<a class="cz-btn cz-btn--lg cz-btn--block" href="{{links.demande}}" style="margin-top: 10px; color: #FFFFFF;">Créer mon association</a>
</div>
</sc-if>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["web","mobile"],"default":"web"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { loginOpen: false, navOpen: false }; }
  renderVals() {
    const m = this.props.device === 'mobile';
    const L = (n) => n + (m ? '-mobile' : '') + '.dc.html';
    const home = L('Main');
    return {
      web: !m, mobile: m,
      loginOpen: this.state.loginOpen, navOpen: this.state.navOpen,
      toggleLogin: () => this.setState({ loginOpen: !this.state.loginOpen }),
      toggleNav: () => this.setState({ navOpen: !this.state.navOpen }),
      links: {
        home: home, fonctionnement: home + '#fonctionnement', tarifs: home + '#tarifs', faq: home + '#faq',
        demande: L('Demande'), connexionAsso: L('ConnexionAssociation'), connexion: L('Connexion')
      }
    };
  }
}
</script>
</body>
</html>
