<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Barre latérale gestionnaire</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#6B6478;text-decoration:none}a:hover{color:#5B51C4}
</style>
</helmet>
<nav data-theme="manager" aria-label="Navigation principale" style="width: 240px; height: 100%; min-height: 900px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E4E0EA; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; font-family: Inter, Arial, sans-serif;">
<a href="MgDashboard.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 12px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px; color: #26215C;">
<svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="mgs-m"><rect width="100" height="100" fill="#fff"/><path d="M 61.9 29.3 A 23.9 23.9 0 1 0 61.9 70.7" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/></mask></defs><circle cx="50" cy="50" r="40" fill="#7F77DD" mask="url(#mgs-m)"/><circle cx="75.5" cy="50" r="5" fill="#D85A30"/></svg>Cotiz</a>
<a href="MgParametres.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 8px; margin-bottom: 8px; border-radius: 10px; background: #F4F2ED; font-size: 12.5px; color: #6B6478;"><span class="cz-avatar cz-avatar--org" style="width: 34px; height: 34px; font-size: 12px;">EY</span><span><b style="display: block; font-size: 13px; color: #1B1830;">Entraide Yopougon</b>Plan Essentiel</span></a>
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"/></svg>
<span style="flex-grow: 1;">{{it.label}}</span>
<sc-if value="{{it.count}}" hint-placeholder-val="{{ false }}"><span class="cz-count">{{it.count}}</span></sc-if>
</a>
</sc-for>
<div style="flex-grow: 1;"></div>
<sc-for list="{{bottom}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"/></svg>
<span style="flex-grow: 1;">{{it.label}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","projets","souscripteurs","paiements","relances","contrats","equipe","abonnement","parametres","profil"],"default":"dashboard"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'dashboard';
    const mk = (key, label, href, icon, count) => {
      const on = key === active;
      return {
        label, href, icon, count: count || false, current: on ? 'page' : 'false',
        style: `display: flex; align-items: center; gap: 10px; padding: 9px 11px; min-height: 40px; box-sizing: border-box; border-radius: 9px; font-size: 13.5px; ${on ? 'background: #EFECFB; color: #5B51C4; font-weight: 600;' : 'color: #6B6478;'}`
      };
    };
    return {
      items: [
        mk('dashboard', 'Tableau de bord', 'MgDashboard.dc.html', 'M3 3h7.5v9H3zM13.5 3H21v5h-7.5zM13.5 11H21v10h-7.5zM3 15h7.5v6H3z'),
        mk('projets', 'Projets', 'MgProjets.dc.html', 'M12 3l2.6 5.5 6 .9-4.3 4.3 1 6L12 17l-5.3 2.7 1-6L3.4 9.4l6-.9z'),
        mk('souscripteurs', 'Souscripteurs', 'MgSouscripteurs.dc.html', 'M9 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM2.5 20a6.5 6.5 0 0 1 13 0M17 11.5a3 3 0 1 0 0-6M18 20a6 6 0 0 0-2.5-4.9'),
        mk('paiements', 'Paiements', 'MgPaiements.dc.html', 'M5.5 5.5h13a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-13a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3zM2.5 10h19M6 15h4', '6'),
        mk('relances', 'Relances', 'MgRelances.dc.html', 'M21 3L10.5 13.5M21 3l-6.5 18-4-7.5-7.5-4z'),
        mk('contrats', 'Contrats', 'MgContrats.dc.html', 'M14 3v5h5M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8zM8.5 14h7M8.5 17.5h4')
      ],
      bottom: [
        mk('equipe', 'Équipe', 'MgEquipe.dc.html', 'M9 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM2.5 20a6.5 6.5 0 0 1 13 0'),
        mk('abonnement', 'Abonnement', 'MgAbonnement.dc.html', 'M5.5 3h13v18l-3-2-3.5 2-3.5-2-3 2zM9 8h6M9 12h6'),
        mk('parametres', 'Paramètres', 'MgParametres.dc.html', 'M4 7h10M18 7h2M4 17h4M12 17h8M16 5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10 15a2 2 0 1 1 0 4 2 2 0 0 1 0-4z')
      ]
    };
  }
}
</script>
</body>
</html>
