<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Projet — Ajout d’un souscripteur</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#F4F2ED;font-family:Inter,Arial,sans-serif;color:#2C2A38}a{color:#5B51C4;text-decoration:none}a:hover{color:#26215C}</style>
</helmet>
<div style="width: 1440px; height: 1250px; overflow: hidden;">
<dc-import name="MgProjetSouscripteurs" modale="{{modale}}" hint-size="1440px,1250px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modale":{"editor":"enum","options":["telephone","compte-existant","nouveau","deja-inscrit"],"default":"telephone"},"$preview":{"width":1440,"height":1250}}'>
class Component extends DCLogic {
  renderVals() { return { modale: this.props.modale || 'telephone' }; }
}
</script>
</body>
</html>
