<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FAECE7;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#993C1D;text-decoration:none}a:hover{color:#26215C}
input,textarea,select,button{font:inherit;color:inherit}
h2.t{margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:18px;color:#1B1830}
.mb-lbl{font-size:12.5px;color:#6B6478}
.mb-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mb-list{background:#FFFFFF;border-radius:14px;box-shadow:0 1px 3px rgba(40,30,80,0.06)}
.mb-list > *{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-bottom:1px solid #F0EDF3;color:#2C2A38;box-sizing:border-box}
.mb-list > *:last-child{border-bottom:none}
</style>
</helmet>

<div data-theme="member" style="{{s.root}}">
<dc-import name="MbNav" device="{{device}}" active="notifications" hint-size="{{s.navHint}}" style="{{s.nav}}"></dc-import>
<div style="{{s.col}}">
<sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}"><header style="background: #FFFFFF; padding: 8px 8px 8px 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E4E0EA; min-height: 60px; box-sizing: border-box; flex-shrink: 0;"><a href="{{links.back}}" aria-label="Retour" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #2C2A38; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></a><div style="flex-grow: 1; min-width: 0; "><div style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px; color: #1B1830; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Notifications</div></div><sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><button type="button" class="cz-btn cz-btn--ghost cz-btn--sm" onClick="{{markAll}}">Tout lire</button></sc-if></header></sc-if>
<div style="{{s.scroll}}">
<div style="{{s.inner}}">
<sc-if value="{{web}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;"><div><a href="{{links.back}}" style="display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 600; margin-bottom: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>Retour</a><h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 28px; color: #1B1830;">Notifications</h1></div><sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><button type="button" class="cz-btn cz-btn--secondary cz-btn--sm" onClick="{{markAll}}">Tout marquer comme lu</button></sc-if></div></sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div class="cz-card cz-card--lg"><div class="cz-empty"><div class="i"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6c0 4-2 5-2 5h16s-2-1-2-5a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0"/></svg></div><div class="t">Aucune notification</div><div class="d">Rappels d’échéance, validations et contrats à signer s’afficheront ici.</div></div></div></sc-if>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px;">
<div class="cz-notif-group">{{g.t}}</div>
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="2">
<a class="{{n.cls}}" href="{{n.href}}" style="color: inherit;">
<span class="ic" style="{{n.icStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"/></svg></span>
<span style="flex-grow: 1; min-width: 0;"><span class="tt" style="display: block;">{{n.tt}}</span><span class="ds" style="display: block;">{{n.ds}}</span><span style="display: inline-block; margin-top: 4px; font-size: 12.5px; font-weight: 600; color: #993C1D;">{{n.cta}} →</span></span>
<span class="tm">{{n.tm}}</span>
<sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}"><span class="unread-dot" aria-label="Non lue"></span></sc-if>
</a>
</sc-for>
</div>
</sc-for>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device": {"editor": "enum", "options": ["web", "mobile"], "default": "web"}, "etat": {"editor": "enum", "options": ["nominal", "tout-lu", "vide"], "default": "nominal"}, "$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { read: null }; }
  renderVals() {
    const m = (this.props.device || 'web') === 'mobile';
    const L = (n) => n + (m ? '-mobile' : '') + '.dc.html';
    const P = this.props, S = this.state;
    const fmt = (x) => String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' F';
    const ok = 'cz-badge cz-badge--success cz-badge--sm', bad = 'cz-badge cz-badge--danger cz-badge--sm', warn = 'cz-badge cz-badge--warning cz-badge--sm', info = 'cz-badge cz-badge--info cz-badge--sm';
    const etat = P.etat || 'nominal';
    const read = S.read !== null ? S.read : etat === 'tout-lu';
    const empty = etat === 'vide';
    const T = {
      warn: ['background: #FBEEDB; color: #8A5410;', 'M14 3v5h5M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8zM8.5 14h7M8.5 17.5h4'],
      late: ['background: #FBE0E0; color: #96201F;', 'M12 3.5l9 16H3zM12 10v4.5M12 17.3v.2'],
      info: ['background: #DEEBF7; color: #1E5585;', 'M12 3a6 6 0 0 0-6 6c0 4-2 5-2 5h16s-2-1-2-5a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0'],
      ok: ['background: #DFF3E7; color: #1E6B3E;', 'M5 12.5l4.5 4.5L19 7.5']
    };
    const G = [
      { t: 'Aujourd’hui', items: [
        { k: 'warn', tt: 'Contrat à signer', ds: 'Entraide Yopougon vous invite à signer le contrat du projet Voyage solidaire.', tm: '09:12', cta: 'Signer le contrat', href: L('MbContrat'), u: true },
        { k: 'late', tt: 'Échéances en retard', ds: 'Centre communautaire : 50 000 F en retard (août et septembre).', tm: '08:00', cta: 'Régulariser', href: L('MbDeclarer'), u: true }] },
      { t: 'Cette semaine', items: [
        { k: 'info', tt: 'Rappel d’échéance', ds: 'Prochaine échéance le 5 octobre : 25 000 F pour Centre communautaire.', tm: 'lun.', cta: 'Voir le projet', href: L('MbProjet') }] },
      { t: 'Plus ancien', items: [
        { k: 'ok', tt: 'Paiement validé', ds: 'Vos 10 000 F pour Mutuelle santé ont été validés.', tm: '06/09', cta: 'Voir l’historique', href: L('MbHistorique') },
        { k: 'ok', tt: 'Paiement validé', ds: 'Vos 10 000 F pour Mutuelle santé ont été validés.', tm: '06/08', cta: 'Voir l’historique', href: L('MbHistorique') },
        { k: 'ok', tt: 'Paiement validé', ds: 'Vos 25 000 F pour Centre communautaire ont été validés.', tm: '07/07', cta: 'Voir l’historique', href: L('MbHistorique') }] }
    ];
    const v = {
      empty, hasUnread: !read && !empty, markAll: () => this.setState({ read: true }),
      groups: empty ? [] : G.map((g) => ({ t: g.t, items: g.items.map((n) => { const u = !!n.u && !read; return { ...n, unread: u, cls: 'cz-notif' + (u ? ' is-unread' : ''), icStyle: T[n.k][0], icon: T[n.k][1] }; }) }))
    };
    const hasNav = true && !(m && false && !v.forceNav);
    const s = {
      root: m ? 'width: 100%; height: 844px; position: relative; display: flex; flex-direction: column; background: #FAECE7; overflow: hidden; font-family: Inter, Arial, sans-serif;'
              : 'width: 100%; height: 1000px; position: relative; display: grid; grid-template-columns: ' + (true ? '240px ' : '') + 'minmax(0, 1fr); background: #FAECE7; overflow: hidden; font-family: Inter, Arial, sans-serif;',
      nav: m ? 'position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;' : 'height: 100%;',
      navHint: m ? '100%,150px' : '240px,100%',
      col: m ? 'flex: 1; min-height: 0; display: flex; flex-direction: column;' : 'min-width: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden;',
      scroll: m ? 'flex: 1; overflow-y: auto; padding: 14px 12px ' + (hasNav ? '170px' : '24px') + ';' : 'flex: 1; overflow-y: auto; padding: 32px 48px;',
      inner: m ? 'display: flex; flex-direction: column; gap: 14px;' : 'max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;',
      bar: m ? 'position: absolute; left: 0; right: 0; bottom: 0; z-index: 25; background: #FFFFFF; border-top: 1px solid #E4E0EA; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px;' : 'display: flex; justify-content: flex-end; gap: 10px; padding-top: 4px;',
      two: m ? 'display: flex; flex-direction: column; gap: 14px;' : 'display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;',
      three: m ? 'display: flex; flex-direction: column; gap: 12px;' : 'display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;',
      overlay: 'position: absolute; inset: 0; z-index: 40; background: rgba(27,24,48,0.4); display: flex; ' + (m ? 'align-items: flex-end;' : 'align-items: center; justify-content: center;'),
      sheet: m ? 'background: #FFFFFF; width: 100%; border-radius: 20px 20px 0 0; padding: 10px 18px 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow-y: auto;' : 'background: #FFFFFF; width: 480px; border-radius: 16px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(27,24,48,0.25);'
    };
    return Object.assign({ device: m ? 'mobile' : 'web', mobile: m, web: !m, showNav: hasNav }, v, { s: Object.assign(s, v.s || {}), links: Object.assign({ back: L('MbAccueil') }, v.links || {}) });
  }
}
</script>
</body>
</html>
