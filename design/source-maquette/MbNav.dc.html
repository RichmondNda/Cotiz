<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Navigation souscripteur</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cotiz-tokens.css">
<link rel="stylesheet" href="ds/cotiz/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:transparent;font-family:Inter,Arial,sans-serif;color:#2C2A38}
a{color:#6B6478;text-decoration:none}a:hover{color:#993C1D}
</style>
</helmet>
<div data-theme="member" style="{{rootStyle}}">
<sc-if value="{{mobile}}" hint-placeholder-val="{{ true }}">
<div style="position: relative;">
<sc-if value="{{fab}}" hint-placeholder-val="{{ true }}"><a class="cz-fab" href="{{links.declarer}}" style="position: absolute; right: 14px; bottom: 82px; color: #FFFFFF;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Déclarer un paiement</a></sc-if>
<nav aria-label="Navigation principale" style="background: #FFFFFF; border-top: 1px solid #E4E0EA; display: flex; justify-content: space-around; padding: 6px 0 14px;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.mStyle}}"><span style="{{it.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"/></svg></span>{{it.label}}</a>
</sc-for>
</nav>
</div>
</sc-if>
<sc-if value="{{web}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Navigation principale" style="width: 240px; height: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E4E0EA; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px;">
<a href="{{links.home}}" style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 16px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px; color: #26215C;"><svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="mbn-m"><rect width="100" height="100" fill="#fff"/><path d="M 61.9 29.3 A 23.9 23.9 0 1 0 61.9 70.7" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/></mask></defs><circle cx="50" cy="50" r="40" fill="#7F77DD" mask="url(#mbn-m)"/><circle cx="75.5" cy="50" r="5" fill="#D85A30"/></svg>Cotiz</a>
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.wStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"/></svg>{{it.label}}</a>
</sc-for>
<a href="{{links.notifs}}" style="{{notifStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6c0 4-2 5-2 5h16s-2-1-2-5a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0"/></svg><span style="flex-grow: 1;">Notifications</span><span class="cz-count cz-count--danger">2</span></a>
<div style="flex-grow: 1;"></div>
<a class="cz-btn cz-btn--block" href="{{links.declarer}}" style="color: #FFFFFF;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Déclarer un paiement</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 8px 0;"><span class="cz-avatar cz-avatar--sm">MD</span><span style="font-size: 13px;"><b style="display: block; color: #1B1830;">Moussa Diarra</b><span style="color: #6B6478;">Souscripteur</span></span></div>
</nav>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["mobile","web"],"default":"mobile"},"active":{"editor":"enum","options":["accueil","projets","historique","profil","notifications","aucun"],"default":"accueil"},"fab":{"editor":"boolean","default":true},"$preview":{"width":390,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (this.props.device || 'mobile') === 'mobile';
    const L = (n) => n + (m ? '-mobile' : '') + '.dc.html';
    const active = this.props.active || 'accueil';
    const I = [
      ['accueil', 'Accueil', L('MbAccueil'), 'M3.5 10.5L12 3.5l8.5 7M5.5 9v9.5a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V9M10 20.5V15h4v5.5'],
      ['projets', 'Projets', L('MbAssociations'), 'M12 3l2.6 5.5 6 .9-4.3 4.3 1 6L12 17l-5.3 2.7 1-6L3.4 9.4l6-.9z'],
      ['historique', 'Historique', L('MbHistorique'), 'M3.5 12a8.5 8.5 0 1 0 2.5-6M3.5 4v4h4M12 7.5V12l3 2'],
      ['profil', 'Profil', L('MbProfil'), 'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4.5 20.5a7.5 7.5 0 0 1 15 0']
    ];
    return {
      mobile: m, web: !m, fab: this.props.fab !== false,
      rootStyle: m ? 'width: 100%; font-family: Inter, Arial, sans-serif;' : 'width: 240px; height: 100%; font-family: Inter, Arial, sans-serif;',
      links: { home: L('MbAccueil'), declarer: L('MbDeclarer'), notifs: L('MbNotifications') },
      notifStyle: `display: flex; align-items: center; gap: 10px; padding: 10px 11px; min-height: 42px; box-sizing: border-box; border-radius: 9px; font-size: 14px; ${active === 'notifications' ? 'background: #F8DDD3; color: #993C1D; font-weight: 600;' : 'color: #6B6478;'}`,
      items: I.map(([k, label, href, icon]) => {
        const on = k === active;
        return {
          label, href, icon, current: on ? 'page' : 'false',
          mStyle: `display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 48px; justify-content: center; font-size: 10.5px; font-weight: 600; color: ${on ? '#993C1D' : '#6B6478'};`,
          pill: `display: inline-flex; padding: 3px 16px; border-radius: 999px; background: ${on ? '#F8DDD3' : 'transparent'};`,
          wStyle: `display: flex; align-items: center; gap: 10px; padding: 10px 11px; min-height: 42px; box-sizing: border-box; border-radius: 9px; font-size: 14px; ${on ? 'background: #F8DDD3; color: #993C1D; font-weight: 600;' : 'color: #6B6478;'}`
        };
      })
    };
  }
}
</script>
</body>
</html>
